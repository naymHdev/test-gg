services:
  redis:
    image: redis:7-alpine
    container_name: awakero-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: awakero-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: naymhossen29
      POSTGRES_DB: adaora-server
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
